services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/app
    networks:
      - wpc-builder
    depends_on:
      database:
        condition: service_healthy

  database:
    image: mariadb:12
    environment:
      MYSQL_DATABASE: wordpress_test
      MYSQL_ROOT_PASSWORD: password
    networks:
      - wpc-builder
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      timeout: 20s
      retries: 10

networks:
  wpc-builder:
    driver: bridge
