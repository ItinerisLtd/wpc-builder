# yamllint disable-line rule:document-start
version: 2
updates:
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: daily
      time: "09:00"
      timezone: Europe/London
    open-pull-requests-limit: 10
    versioning-strategy: increase
    cooldown:
      default-days: 21
    groups:
      composer-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: daily
      time: "09:00"
      timezone: Europe/London
    open-pull-requests-limit: 10
    versioning-strategy: increase
    groups:
      stylelint:
        patterns:
          - "*stylelint*"
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
