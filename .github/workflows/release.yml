name: Release package

on:
  release:
    types: [published]

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: "npm"
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: bash scripts/assert-semver-tag.sh "${RELEASE_TAG}"
      - name: Validate release notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: bash scripts/assert-release-notes.sh "${RELEASE_TAG}"
      - name: Build release package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: bash scripts/build-release-asset.sh "${RELEASE_TAG}"
      - name: Upload release package
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "${RELEASE_TAG}" build/*.zip --clobber
      - name: Generate changelog PR token
        id: changelog-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CHANGELOG_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CHANGELOG_BOT_PRIVATE_KEY }}
          permission-issues: write
          permission-pull-requests: write
      - name: Update CHANGELOG.md
        env:
          # GITHUB_TOKEN writes the branch and the CHANGELOG.md commit, which
          # GitHub only auto-signs for its own token. A required_signatures
          # ruleset would reject the commit otherwise.
          GITHUB_TOKEN: ${{ github.token }}
          # A pull request opened with the workflow's own token never triggers
          # `on: pull_request`, so CI would not run and Kodiak could not merge.
          # The itineris-changelog App token opens it instead, so its required
          # checks report and Kodiak approves and merges it.
          CHANGELOG_PR_TOKEN: ${{ steps.changelog-token.outputs.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: bash scripts/update-changelog.sh "${RELEASE_TAG}"

  publish:
    needs: package
    runs-on: ubuntu-latest
    environment: packagist
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download release package
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --pattern '*.zip' --dir build
      - name: Upload package artifact to Private Packagist
        uses: packagist/artifact-publish-github-action@187f3c3bdde9cfa570108893f243d515875cc5bb # v1.0.2
        with:
          package_name: itinerisltd/wpc-builder
          organization_url_name: itinerisltd
          artifact: ${{ github.workspace }}/build/wpc-builder-${{ github.event.release.tag_name }}.zip
